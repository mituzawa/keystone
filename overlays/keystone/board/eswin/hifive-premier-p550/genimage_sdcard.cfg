# SD-card image for the HiFive Premier P550. The firmware (bootchain with
# fw_payload.bin) lives in QSPI flash, not on the SD card, so a single
# bootable rootfs partition is enough; U-Boot's distro/bootstd boot reads
# /boot/extlinux/extlinux.conf from it. The GPT partition name "rootfs"
# is what root=PARTLABEL=rootfs in extlinux.conf resolves to.
image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition rootfs {
		image = "rootfs.ext4"
		partition-type-uuid = 0fc63daf-8483-4772-8e79-3d69d8477de4
		bootable = true
	}
}
